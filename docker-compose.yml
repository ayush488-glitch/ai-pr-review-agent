# docker-compose.yml — AI PR Review Agent
#
# HYBRID MODE: Neon (cloud Postgres) + local Redis + api + worker
#
# WHY HYBRID:
#   Postgres -> Neon cloud (TimescaleDB). Review data persists forever, survives laptop restarts.
#   Redis    -> local Docker. Job queue, idempotency keys. Ephemeral is fine.
#
# Neon is accessed via HTTPS (port 5432 over TLS) — works from anywhere.
# Redis (6379) local port used for job queue.
#
# Usage:
#   docker-compose up --build
#
# For all-local dev (no cloud at all):
#   docker-compose -f docker-compose.dev.yml up --build

services:

  # ---------------------------------------------------------------------------
  # Redis — local, port 6379
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: prreview_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - prreview_net

  # ---------------------------------------------------------------------------
  # API — FastAPI application
  # Postgres -> Neon cloud (from .env DATABASE_URL)
  # Redis    -> local container
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prreview_api
    ports:
      - "${API_PORT:-8001}:8000"
    env_file:
      - .env
    environment:
      # DATABASE_URL comes from .env -> Neon cloud (persistent)
      # Override Redis to point at local Docker service
      REDIS_URL: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - prreview_net

  # ---------------------------------------------------------------------------
  # Worker — ARQ async job queue worker
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prreview_worker
    command: ["python3", "-m", "arq", "backend.job_queue.arq_worker.WorkerSettings"]
    env_file:
      - .env
    environment:
      REDIS_URL: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - prreview_net

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  prreview_net:
    driver: bridge

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes: {}

